services:
  postgres:
    image: postgres:17.11-bookworm
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: raggy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: raggy
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - raggy-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raggy -d raggy"]
      interval: 5s
      timeout: 5s
      retries: 12

  falkordb:
    image: falkordb/falkordb:v4.20.4
    profiles: ["falkor"]
    ports:
      - "127.0.0.1:${FALKORDB_PORT:-6380}:6379"
      - "127.0.0.1:${FALKORDB_BROWSER_PORT:-3001}:3000"
    environment:
      REDIS_ARGS: "--appendonly yes"
    volumes:
      - raggy-falkordb-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  raggy-postgres-data:
  raggy-falkordb-data:
