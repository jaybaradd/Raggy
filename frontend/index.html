<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raggy — Multimodal RAG Chatbot</title>
  <meta name="description" content="A multimodal RAG chatbot that answers questions grounded in your uploaded documents." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app-shell">

    <!-- ── Sidebar ─────────────────────────────────────────────────────────── -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">⬡</span>
          <span class="logo-text">Raggy</span>
        </div>
        <button class="new-chat-btn" id="newChatBtn" title="New chat">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          New chat
        </button>
      </div>

      <div class="session-list" id="sessionList">
        <!-- Sessions are injected by JS -->
      </div>

      <div class="sidebar-footer">
        <span class="phase-badge">Phase 0 · Foundations</span>
      </div>
    </aside>

    <!-- ── Main area ──────────────────────────────────────────────────────── -->
    <main class="main-area">

      <!-- Top bar -->
      <header class="topbar">
        <h1 class="chat-title" id="chatTitle">New chat</h1>
        <div class="topbar-actions">
          <!-- Upload trigger -->
          <label class="upload-btn" id="uploadLabel" title="Upload a PDF">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            Upload PDF
            <input type="file" id="fileInput" accept=".pdf" hidden />
          </label>
        </div>
      </header>

      <!-- Upload status toast -->
      <div class="upload-status" id="uploadStatus" hidden>
        <span class="upload-status-icon" id="uploadStatusIcon">⏳</span>
        <span id="uploadStatusText">Uploading…</span>
        <button class="toast-close" id="toastClose">×</button>
      </div>

      <!-- Message thread -->
      <div class="message-thread" id="messageThread">
        <!-- Empty state -->
        <div class="empty-state" id="emptyState">
          <div class="empty-icon">⬡</div>
          <h2>Start a conversation</h2>
          <p>Upload a PDF and ask questions about it, or just chat with Raggy.</p>
          <div class="empty-chips">
            <button class="chip" data-prompt="Summarise the document for me.">Summarise the document</button>
            <button class="chip" data-prompt="What are the key points?">Key points</button>
            <button class="chip" data-prompt="What conclusions does the document reach?">Conclusions</button>
          </div>
        </div>
      </div>

      <!-- Input bar -->
      <div class="input-area">
        <div class="input-wrapper">
          <textarea
            id="messageInput"
            class="message-input"
            placeholder="Ask anything…"
            rows="1"
            maxlength="32000"
          ></textarea>
          <button class="send-btn" id="sendBtn" disabled title="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
        <p class="input-hint">Raggy may make mistakes. Verify important information.</p>
      </div>

    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
